services:
  whisperspeech-tts:
    build:
      context: ./docker-whisperspeech
      dockerfile: Dockerfile
    container_name: whisperspeech-tts
    ports:
      - "8000:8000"
  blip-itt:
    build:
      context: ./docker-blipbase
      dockerfile: Dockerfile
    container_name: blip-itt
    ports:
      - "8002:8002"
  floyed-tti:
    build:
      context: ./docker-floyed
      dockerfile: Dockerfile
    container_name: floyed-tti
    ports:
      - "8001:8001"
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=ics'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
