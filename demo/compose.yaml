services:
  whisperspeech-tts:
    build:
      context: ./docker-whisperspeech
      dockerfile: Dockerfile
    container_name: whisperspeech-tts
    ports:
      - "8000:8000"
  yolo:
    build:
      context: ./docker-yolo
      dockerfile: Dockerfile
    container_name: yolo	      
    ports:
      - "8003:8003"	    
  blip-itt:
    build:
      context: ./docker-blipbase
      dockerfile: Dockerfile
    container_name: blip-itt
    ports:
      - "8002:8002"
  floyed-tti:
    build:
      context: ./docker-floyed
      dockerfile: Dockerfile
    container_name: floyed-tti
    ports:
      - "8001:8001"
  sentiment:
    build:
      context: ./docker-sentiment
      dockerfile: Dockerfile
    container_name: sentiment
    ports:
      - "8004:8004"
  classification-custom-cnn:
    build:
      context: ./docker-classification-custom-cnn
      dockerfile: Dockerfile
    container_name: classification-custom-cnn
    ports:
      - "8005:8005"
    mem_limit: 12g
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=ics'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
